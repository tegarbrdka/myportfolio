<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#080808"/>

  <!-- Corner brackets -->
  <line x1="3" y1="3" x2="9" y2="3" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="3" y1="3" x2="3" y2="9" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="29" y1="3" x2="23" y2="3" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="29" y1="3" x2="29" y2="9" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="3" y1="29" x2="9" y2="29" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="3" y1="29" x2="3" y2="23" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="29" y1="29" x2="23" y2="29" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>
  <line x1="29" y1="29" x2="29" y2="23" stroke="rgba(200,200,200,0.6)" stroke-width="1"/>

  <!-- Letter T — Cormorant style, thin serif -->
  <text
    x="50%" y="68%"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-weight="300"
    font-size="18"
    fill="rgba(255,255,255,0.92)"
    letter-spacing="1"
  >T</text>
</svg>
